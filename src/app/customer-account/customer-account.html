<div class="container mt-4">

  <button class="btn btn-outline-secondary mb-4" (click)="goBack()">
    <i class="bi bi-arrow-left"></i> Retour
  </button>

  <div class="profile-card mb-4" *ngIf="customer">
    <div class="profile-avatar">
      <i class="bi bi-person-circle"></i>
    </div>
    <div class="profile-info">
      <h3 class="profile-name">{{ customer.name }}</h3>
      <p class="profile-email"><i class="bi bi-envelope me-2"></i>{{ customer.email }}</p>
      <span class="badge bg-primary fs-6"># {{ customer.id }}</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex align-items-center gap-2">
      <i class="bi bi-credit-card"></i>
      <strong>Comptes bancaires</strong>
    </div>
    <div class="card-body text-muted text-center py-5">
      <i class="bi bi-bank2 fs-1 d-block mb-2"></i>
      Aucun compte disponible pour ce client.
    </div>
  </div>

</div>
