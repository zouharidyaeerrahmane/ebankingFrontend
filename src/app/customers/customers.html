<div class="container mt-2">
  <div class="card">
    <div class="card-header">Customers</div>
    <div class="card-body">
      <div *ngIf="errorMessage" class="text-danger mb-2">{{errorMessage}}</div>
      <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearchCustomers()">
        <div class="input-group mb-3">
          <label class="input-group-text">Keyword :</label>
          <input type="text" formControlName="keyword" class="form-control">
          <button class="btn btn-info">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Email</th><th></th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of customers">
            <td>{{c.id}}</td>
            <td>{{c.name}}</td>
            <td>{{c.email}}</td>
            <td>
              <button (click)="handleDeleteCustomer(c)" class="btn btn-danger">
                <i class="bi bi-trash"></i>
              </button>
            </td>
            <td>
              <button (click)="handleCustomerAccounts(c)" class="btn btn-success">
                Accounts
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
